<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Startseite</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: skyblue;
            font-size: 30px;
            caret-color: transparent;
            text-align: center;
        }

        .hamburger {
            font-size: 30px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 101;
            color: white;
        }
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            right: 0;
            background-color: #333;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            z-index: 99;
        }
        .sidebar a {
            padding: 8px 16px;
            text-decoration: none;
            font-size: 25px;
            color: #fff;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #575757;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 20px;
            left: 25px;
            z-index: 101;
            font-size: 36px;
            color: #fff;
            cursor: pointer;
        }
        
     .start {
        font-size: 50px;
        font-weight: bold;
        color: black;
        text-decoration: underline;
        }

     .yt {
        font-size: 25px;
        background-color: red;
        border-radius: 10px;
        border: none;
        color: white;
        padding: 10px 20px;
        margin: 10px;
        }

    .yt:hover {
        cursor: pointer;
        font-size: 30px;
        }

     .download {
        font-size: 25px;
        background-color: green;
        border-radius: 10px;
        border: none;
        color: white;
        padding: 10px 20px;
        margin: 10px;
        }

       .download:hover {
            cursor: pointer;
            font-size: 30px;
        }



     .skins {
            font-size: 25px;
            background-color: blue;
            border-radius: 10px;
            border: none;
            color: white;
            padding: 10px 20px;
            margin: 10px;
        }

     .skins:hover {
        cursor: pointer;
        font-size: 30px;
        }
        
    </style>
</head>

<body>
    <h1 class="start">Supergamer</h1>

    <h4>Das ist die öffentliche Seite von Supergamer.</h4>

     <button class="yt" onclick="openYT()">Mein YT Kanal</button>

    <script>
        function openYT() {
            window.open("https://www.youtube.com/watch?v=xvFZjo5PgG0", "_blank");
        }

        function openSkins(){
        window.location.href = "https://supergamer.pages.dev/skins/skins";
}

function applyForm(){
    window.location.href = "https://apply.supergamer.pages.dev";
}

        function downloadEXE() {
            const link = document.createElement("a");
            link.href = "GrafikKartenReload.exe";
            link.download = "GrafikKartenReload.exe";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

                function toggleSidebar() {
      const sidebar = document.getElementById("mySidebar");
      sidebar.style.width = "250px";
    }
    function closeSidebar() {
      const sidebar = document.getElementById("mySidebar");
      sidebar.style.width = "0";
    }
    
    </script>
