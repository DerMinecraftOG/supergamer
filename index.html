<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bewerbung</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: skyblue;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 25px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #000;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: white;
            border: 1px solid black;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #ddd;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Bewerbung</h1>

    <p>
        Bewirb dich hier als Developer oder Designer.
    </p>

    <form id="applicationForm">

        <label>Name *</label>
        <input
            type="text"
            name="name"
            placeholder="Dein Name"
            required
        >

        <label>Discord Tag *</label>
        <input
            type="text"
            name="discord"
            placeholder="z.B. username"
            required
        >

        <label>E-Mail *</label>
        <input
            type="email"
            name="email"
            placeholder="deine@email.de"
            required
        >

        <label>Alter *</label>
        <input
            type="number"
            name="age"
            min="13"
            max="100"
            required
        >

        <label>Position *</label>
        <select name="position" required>
            <option value="">Bitte auswählen</option>
            <option value="Developer">Developer</option>
            <option value="Designer">Designer</option>
            <option value="Developer & Designer">
                Developer & Designer
            </option>
        </select>

        <label>Erfahrung *</label>
        <textarea
            name="experience"
            placeholder="Welche Erfahrungen hast du?"
            required
        ></textarea>

        <label>Portfolio / GitHub</label>
        <input
            type="url"
            name="portfolio"
            placeholder="https://..."
        >

        <label>Warum möchtest du dich bewerben? *</label>
        <textarea
            name="reason"
            placeholder="Erzähle uns etwas über dich..."
            required
        ></textarea>

        <button type="submit">
            Bewerbung absenden
        </button>

    </form>

    <div id="status"></div>

</div>


<script>

    // =====================================================
    // DEIN DISCORD WEBHOOK
    // =====================================================

    const WEBHOOK_URL = "https://discord.com/api/webhooks/1556010416407318569/OpR9YKTtjWktPi3UhTcAUfE_Qhx8QEKDv1RJduorGyqK897q2o94IMkztm_LJ5tubBz-";


    // =====================================================
    // FORMULAR
    // =====================================================

    document
        .getElementById("applicationForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const form = event.target;
            const status = document.getElementById("status");

            status.textContent = "Bewerbung wird gesendet...";

            const name = form.name.value;
            const discord = form.discord.value;
            const email = form.email.value;
            const age = form.age.value;
            const position = form.position.value;
            const experience = form.experience.value;
            const portfolio = form.portfolio.value;
            const reason = form.reason.value;


            // =================================================
            // DISCORD EMBED
            // =================================================

            const payload = {

                username: "Bewerbungs-System",

                embeds: [

                    {
                        title: "📩 Neue Bewerbung",

                        color: 5814783,

                        fields: [

                            {
                                name: "👤 Name",
                                value: name,
                                inline: true
                            },

                            {
                                name: "💬 Discord",
                                value: discord,
                                inline: true
                            },

                            {
                                name: "📧 E-Mail",
                                value: email,
                                inline: true
                            },

                            {
                                name: "🎂 Alter",
                                value: age,
                                inline: true
                            },

                            {
                                name: "💼 Bewerbung als",
                                value: position,
                                inline: true
                            },

                            {
                                name: "🔗 Portfolio",
                                value: portfolio || "Nicht angegeben"
                            },

                            {
                                name: "💻 Erfahrung",
                                value: experience
                            },

                            {
                                name: "📝 Motivation",
                                value: reason
                            }

                        ],

                        footer: {
                            text: "Bewerbungs-System"
                        },

                        timestamp: new Date().toISOString()
                    }

                ]

            };


            // =================================================
            // AN DISCORD SENDEN
            // =================================================

            try {

                const response = await fetch(WEBHOOK_URL, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(payload)

                });


                if (!response.ok) {
                    throw new Error("Discord Fehler");
                }


                status.textContent =
                    "✅ Bewerbung erfolgreich abgeschickt!";

                form.reset();


            } catch (error) {

                console.error(error);

                status.textContent =
                    "❌ Fehler beim Senden der Bewerbung.";

            }

        });

</script>

</body>
</html>
